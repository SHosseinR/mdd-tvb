[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdd-tvb"
version = "0.1.0"
description = "A reproducible TVB/Jansen-Rit whole-brain baseline with a 26-channel EEG monitor."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.8,<4",
  "mne>=1.10,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scipy>=1.11,<2",
  "tvb-library==2.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
mdd-tvb = "mdd_tvb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

