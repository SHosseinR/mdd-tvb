[paths]
baseline_config = "configs/baseline.toml"
dataset_root = "D:/university/projects/graph-opt/tbdbrain/TDBRAIN_Dataset_V3_1/output/preprocessed_tdbrain_restEC_set2"
output_dir = "outputs/m5_v2"

[empirical]
groups = ["Healthy", "MDD"]
max_duration_s = 120.0
n_jobs = 4
apply_surface_laplacian = true

[features]
epoch_seconds = 2.0
frequency_min_hz = 2.0
frequency_max_hz = 45.0
coherence_pca_components = 12
coherence_transform = "reliable_edges"
coherence_reliability_threshold = 0.40
coherence_max_features = 128
coherence_fit_bands = ["theta", "alpha", "beta"]
use_mechanistic_spectrum = true
holdout_fraction = 0.20
split_seed = 20260911
psd_weight = 0.30
spectral_summary_weight = 0.25
alpha_topography_weight = 0.15
coherence_weight = 0.30

[design]
samples = 256
replicates = 1
duration_ms = 20000.0
transient_ms = 2000.0
dt_ms = 0.5
n_jobs = 6
seed = 271829
simulation_seed = 19001
global_coupling_range = [4.0, 10.0]
mu_range = [0.15, 0.27]
a_scale_range = [0.65, 1.05]
b_scale_range = [0.80, 1.20]
noise_nsig_range = [0.003, 0.030]
regional_time_log_sd_range = [0.04, 0.16]
noise_tau_ms = 1.0
max_parameter_deviation = 0.40
network_weight_deviation = 0.10
fit_network_endpoint_gains = false
# Fixed, group-blind sensor/unmodelled-neural background. It is applied before
# the same CSD transform and is not interpreted as a disease parameter.
observation_noise_fraction = 0.40
observation_noise_exponent = 0.50
reference_global_coupling = 7.0
reference_mu = 0.22
reference_a_scale = 0.80
reference_b_scale = 0.95
reference_noise_nsig = 0.010
reference_regional_time_log_sd = 0.08

[fit]
group_prior_strength = 0.05
subject_prior_strength = 0.01
subject_prior_center = "pooled"
